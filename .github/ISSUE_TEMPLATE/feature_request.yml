name: Feature request
description: Suggest a new command or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or the problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How should it work?
      placeholder: |
        runsite env import .env --service api
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
