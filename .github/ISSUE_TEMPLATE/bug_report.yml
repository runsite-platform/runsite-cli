name: Bug report
description: Something in the CLI does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what did you get instead?
      placeholder: |
        Ran `runsite deploy api` and expected ... but got ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. runsite login
        2. runsite ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CLI version
      description: Output of `runsite --version`
      placeholder: runsite 0.3.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux x86_64
        - Linux ARM64
        - macOS Apple Silicon
        - macOS Intel
        - Windows
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Paste the error output. Remove API keys (`ak_live_...`) first.
      render: shell
